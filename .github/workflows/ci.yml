name: Django CI
on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Build Docker image
        run: |
          docker build -t myapp:latest .

      - name: Run lint inside Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app myapp:latest poetry run flake8 .
        continue-on-error: true

      - name: Run tests inside Docker
        run: |
              docker run --rm -v ${{ github.workspace }}:/app \
              -e SECRET_KEY=${{ secrets.SECRET_KEY }} \
              myapp:latest poetry run python manage.py test

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag and push Docker image
        run: |
          docker tag myapp:latest ${{ secrets.DOCKER_USERNAME }}/hab:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/hab:${{ github.sha }}

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Deploy to server
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            docker push ${{ secrets.DOCKER_USERNAME }}/hab:${{ github.sha }}
            docker stop hab || true
            docker rm hab || true
            docker run -d --name hab -p 80:8000 ${{ secrets.DOCKER_USERNAME }}/hab:${{ github.sha }}
          EOF